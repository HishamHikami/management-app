# Builds the iPhone app on GitHub's macOS runners.
# With the Apple secrets set (see docs/RELEASE.md) it signs and uploads to TestFlight, creating a
# temporary App Store certificate + profile through the API (no registered devices needed);
# without them it does an unsigned build to prove the app compiles.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-64af2a6d-20k386]
    paths: ["mobile/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode (Apple requires the iOS 27 SDK from April 2027)
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Packages
        working-directory: mobile
        run: |
          flutter --version
          flutter pub get

      - name: Are signing secrets set?
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: echo "ready=$([ -n "$ASC_KEY_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned check)
        if: steps.signing.outputs.ready != 'true'
        working-directory: mobile
        run: flutter build ios --release --no-codesign --build-number $((100 + ${{ github.run_number }}))

      - name: Build, sign and upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        working-directory: mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE=com.halacreative.ksariyadh
          BUILD=$((100 + ${{ github.run_number }}))
          SIGN_DIR="$RUNNER_TEMP/sign"
          SIGN="$GITHUB_WORKSPACE/.github/workflows/asc_signing.py"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"

          # Signing tools (isolated venv; pinned)
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          PY="$RUNNER_TEMP/venv/bin/python"

          # 1. Fresh App Store certificate + profile from Apple (no registered devices needed)
          "$PY" "$SIGN" setup "$SIGN_DIR" "$BUNDLE" "KSA Riyadh CI $BUILD"
          PROFILE_UUID=$("$PY" -c "import json;print(json.load(open('$SIGN_DIR/state.json'))['uuid'])")
          PROFILE_NAME=$("$PY" -c "import json;print(json.load(open('$SIGN_DIR/state.json'))['name'])")

          # 2. Temporary keychain with the certificate, and the profile where Xcode looks
          KC="$RUNNER_TEMP/ci.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$SIGN_DIR/dist.p12" -k "$KC" -P "$(cat "$SIGN_DIR/p12pass")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN_DIR/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

          # 3. Build with the version from pubspec.yaml, then sign the app target manually
          flutter build ios --release --no-codesign --build-number $BUILD
          "$PY" "$SIGN" patch-project ios/Runner.xcodeproj/project.pbxproj "$BUNDLE" "$TEAM_ID" "$PROFILE_NAME"

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          # 4. Upload to App Store Connect, then wait until Apple has processed it
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          "$PY" "$SIGN" wait-build "$BUNDLE" "$BUILD" "$SIGN_DIR"

      - name: Remove temporary signing certificate, profile and keychain
        if: always() && steps.signing.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ] && [ -f "$ASC_KEY_PATH" ]; then
            "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.github/workflows/asc_signing.py" cleanup "$RUNNER_TEMP/sign" || true
          fi
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/sign" "$ASC_KEY_PATH" "$RUNNER_TEMP/export.plist"
